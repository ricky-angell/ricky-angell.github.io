  <h2>Course Overview</h2>
  <p class="lead">By the end of this course you'll know which services to offer, what equipment to buy first, which licenses apply in your state, how to price a yard, and how to land your first recurring customers.</p>
  <div class="cols">
    <div><h4>Who it's for</h4>Beginners who want to start a lawn care, landscaping or gardening business, starting small with one truck and trailer.</div>
    <div><h4>How it works</h4>Every module ends with a <strong>Do This Today</strong> task. Finish it before you move on.</div>
  </div>
  <h3>How to use this course</h3>
  <ol>
    <li>Go in order. Licensing rules decide which services you can sell, so don't skip Module 4.</li>
    <li>Do each Do This Today task before the next module.</li>
    <li>Post your progress in the BBY community for feedback.</li>
    <li>Rules and prices vary by state and city. Every number here is a starting range.</li>
  </ol>
  <h3>Honest note</h3>
  <p>Landscaping is outdoor physical work, and it's seasonal in most of the country. This course teaches you how to build the business. It doesn't promise income. What you earn depends on your prices, your route, your crew and the weather.</p>
</template>

<template id="t-1">
  <div class="kicker">Module 1</div>
  <h2>Is This Business Right for You?</h2>
  <p class="lead">Lawn care is one of the easiest service businesses to start small and one of the hardest to run without a plan for winter.</p>
  <h3>1.1 · The honest pros and cons</h3>
  <div class="cols">
    <div><h4>Pros</h4><ul><li>Low startup cost if you begin with mowing</li><li>Recurring weekly or biweekly customers</li><li>Easy to add services: mulch, cleanups, shrubs, planting</li><li>Steady demand from homeowners, rentals and businesses</li></ul></div>
    <div><h4>Cons</h4><ul><li>Seasonal: slow or no mowing in winter in many states</li><li>Hot, physical work in all weather</li><li>Equipment breaks and needs maintenance</li><li>Easy to start, so there's a lot of low-price competition</li></ul></div>
  </div>
  <h3>1.2 · A real day on the route</h3>
  <ol>
    <li>Fuel up, check oil and blades, load the trailer.</li>
    <li>Drive a planned route of yards close together.</li>
    <li>Mow, trim, edge and blow each property.</li>
    <li>Snap a photo when you finish and let the customer know.</li>
    <li>Quote new jobs between stops.</li>
    <li>Clean and sharpen equipment, send invoices, plan tomorrow.</li>
  </ol>
  <h3>1.3 · Check your local market</h3>
  <ul>
    <li>Search Google Maps and Facebook for lawn care in your area and write down their services and prices.</li>
    <li>Look for neighborhoods with large lots, rentals or older homeowners.</li>
    <li>Check Nextdoor and local groups for people asking for yard help.</li>
  </ul>
  <div class="today"><b>Do This Today</b>List 5 local lawn care companies with their services and any prices you can find.</div>
</template>

<template id="t-2">
  <div class="kicker">Module 2</div>
  <h2>Choose Your Services</h2>
  <p class="lead">Start with services you can do well with basic equipment, then add higher-value work as you learn.</p>
  <div class="tablewrap"><table>
    <thead><tr><th>Level</th><th>Services</th><th>Notes</th></tr></thead>
    <tbody>
      <tr><td>Start here</td><td>Mowing, trimming, edging, blowing</td><td>Recurring income; lowest equipment cost</td></tr>
      <tr><td>Add next</td><td>Spring and fall cleanups, leaf removal, mulch, shrub trimming</td><td>Bigger one-time jobs from the same customers</td></tr>
      <tr><td>Grow into</td><td>Planting, garden beds, sod, aeration, seeding</td><td>Higher prices; check your state's landscape license rules</td></tr>
      <tr><td>License first</td><td>Weed killer, pesticide or fertilizer application; irrigation; tree work</td><td>Often needs a state license (Module 4)</td></tr>
      <tr><td>Off-season</td><td>Snow removal, holiday lights, gutter cleaning</td><td>Keeps income coming in winter</td></tr>
    </tbody>
  </table></div>
  <div class="today"><b>Do This Today</b>Write the 3–5 services you'll start with and 2 you'll add later.</div>
</template>

<template id="t-3">
  <div class="kicker">Module 3</div>
  <h2>Equipment &amp; Startup Costs</h2>
  <p class="lead">Buy what you need for your starting services. Upgrade as the money comes in.</p>
  <h3>3.1 · Starter equipment</h3>
  <ul>
    <li>Commercial or heavy-duty push mower to start; a zero-turn later for bigger lawns</li>
    <li>String trimmer, edger and backpack or handheld blower</li>
    <li>Hedge trimmer, rakes, shovels, wheelbarrow, pruners</li>
    <li>Truck and open utility trailer with ramp and tie-downs</li>
    <li>Gas cans, spare blades and trimmer line, blade sharpener</li>
    <li>Safety gear: eye and ear protection, gloves, boots</li>
  </ul>
  <h3>3.2 · Buy smart</h3>
  <ul>
    <li>Get prices from a local dealer and a big-box store. Dealers usually service what they sell.</li>
    <li>Used commercial equipment can save a lot; have it checked before you pay.</li>
    <li>Keep a maintenance log for every machine.</li>
  </ul>
  <h3>3.3 · Your startup budget</h3>
  <p>List every cost: equipment, trailer, first-year insurance, licenses and registration, scheduling software, signs and cards, and 3 months of fuel and parts. Add a 10–15% buffer. Price each item from real local quotes.</p>
  <div class="today"><b>Do This Today</b>Write your starter equipment list and get real prices for every item.</div>
</template>

<template id="t-4">
  <div class="kicker">Module 4</div>
  <h2>Licenses, Pesticide Rules &amp; Insurance</h2>
  <p class="lead">Mowing usually just needs a business license. Chemicals, irrigation and bigger landscape jobs often need state licenses. (<a href="https://www.insureon.com/blog/landscaping-licensing-requirements" target="_blank" rel="noopener">Insureon</a>)</p>
  <h3>4.1 · Business basics</h3>
  <ol>
    <li>Register your business (LLC or sole proprietorship) with your state.</li>
    <li>Get a free EIN at <a href="https://www.irs.gov/businesses/small-businesses-self-employed/apply-for-an-employer-identification-number-ein-online" target="_blank" rel="noopener">irs.gov</a>.</li>
    <li>Get your city or county business license.</li>
    <li>Open a separate business bank account.</li>
  </ol>
  <h3>4.2 · State landscape contractor licenses</h3>
  <p>Some states require a landscape license for installation work, often above a dollar amount. Examples:</p>
  <div class="tablewrap"><table>
    <thead><tr><th>State</th><th>Rule</th></tr></thead>
    <tbody>
      <tr><td>California</td><td>Contractor (CSLB) license for jobs of $1,000+ in labor and materials, or jobs needing a permit or employees</td></tr>
      <tr><td>Oregon</td><td>Landscape license for work valued at $1,000+</td></tr>
      <tr><td>North Carolina</td><td>Landscape contractor license for work valued at $30,000+</td></tr>
    </tbody>
  </table></div>
  <p class="note">From <a href="https://www.insureon.com/blog/landscaping-licensing-requirements" target="_blank" rel="noopener">Insureon (June 2026)</a>. Irrigation work typically needs a landscape license too. Check your own state's licensing board.</p>
  <h3>4.3 · Weed killer and pesticides</h3>
  <p>Spraying weed killer or pesticides on customers' yards for pay usually needs a state applicator license, even for common products. In Texas, for example, anyone who applies any pesticide to lawns, trees or shrubs for hire must be licensed by the Texas Department of Agriculture. Fertilizer-only work doesn't need that license there. (<a href="https://texasagriculture.gov/RegulatoryPrograms/Pesticides/LicensingtoApplyPesticidestoLawns,TreesOr.aspx" target="_blank" rel="noopener">Texas Dept. of Agriculture</a>)</p>
  <ul>
    <li>Texas's commercial license requires passing state exams, proof of insurance and a $200 application fee, plus yearly continuing education.</li>
    <li>Some states also certify fertilizer applicators.</li>
    <li>Until you're licensed, don't spray. Refer it out or partner with a licensed applicator.</li>
  </ul>
  <h3>4.4 · Insurance</h3>
  <div class="tablewrap"><table>
    <thead><tr><th>Policy</th><th>What it covers</th><th>Median cost</th></tr></thead>
    <tbody>
      <tr><td>General liability</td><td>Damage to a customer's property or injuries (a rock through a window)</td><td class="num">$63/mo · $761/yr</td></tr>
      <tr><td>Tools &amp; equipment</td><td>Stolen or damaged mowers and gear</td><td class="num">$53/mo · $637/yr</td></tr>
      <tr><td>Commercial auto</td><td>Your work truck</td><td class="num">$299/mo · $3,590/yr</td></tr>
      <tr><td>Workers' comp</td><td>Employee injuries; required in most states once you hire</td><td class="num">$150/mo · $1,802/yr</td></tr>
    </tbody>
  </table></div>
  <p class="note">Median costs for landscaping businesses from <a href="https://www.insureon.com/landscaping-business-insurance/cost" target="_blank" rel="noopener">Insureon</a> (2026). Get at least 3 quotes.</p>
  <div class="today"><b>Do This Today</b>Look up your state's landscape and pesticide licensing rules and write down which of your services need a license.</div>
</template>

<template id="t-5">
  <div class="kicker">Module 5</div>
  <h2>Pricing Your Services</h2>
  <p class="lead">Price by the job, not by the hour. Customers want to know the price before you start.</p>
  <h3>5.1 · Mowing price ranges</h3>
  <div class="tablewrap"><table>
    <thead><tr><th>Lawn size</th><th>Typical price per mow</th></tr></thead>
    <tbody>
      <tr><td>¼ acre</td><td class="num">$25–$60</td></tr>
      <tr><td>½ acre</td><td class="num">$50–$75</td></tr>
      <tr><td>¾ acre</td><td class="num">$100–$150</td></tr>
      <tr><td>1 acre</td><td class="num">$150–$200</td></tr>
      <tr><td>2 acres</td><td class="num">$250–$350</td></tr>
    </tbody>
  </table></div>
  <p class="note">From <a href="https://www.getjobber.com/academy/lawn-care/how-to-price-out-lawn-care-services/" target="_blank" rel="noopener">Jobber's 2026 pricing guide</a>. Check these against your local competitors.</p>
  <h3>5.2 · Other services</h3>
  <div class="tablewrap"><table>
    <thead><tr><th>Service</th><th>Typical range</th></tr></thead>
    <tbody>
      <tr><td>Yard cleanup</td><td class="num">$200–$600</td></tr>
      <tr><td>Leaf removal</td><td class="num">$190–$600</td></tr>
      <tr><td>Mulch cleanup</td><td class="num">$100–$350</td></tr>
      <tr><td>Shrub trimming</td><td class="num">$5–$20 per bush</td></tr>
      <tr><td>Core aeration</td><td class="num">$75–$250 per 10,000 sq ft</td></tr>
    </tbody>
  </table></div>
  <h3>5.3 · Price formula</h3>
  <p class="formula">Price = labor + materials + overhead and equipment + profit</p>
  <p>Time yourself on each yard for the first few weeks. If a yard takes longer than you priced, raise it before the next season.</p>
  <ul>
    <li>Sell seasonal contracts (for example, 28 mows) for steady income.</li>
    <li>Charge more for overgrown first cuts.</li>
    <li>Raise prices every year to cover fuel and equipment.</li>
  </ul>
  <div class="today"><b>Do This Today</b>Set your price list for each service and lawn size.</div>
</template>

<template id="t-6">
  <div class="kicker">Module 6</div>
  <h2>Routes, Scheduling &amp; Operations</h2>
  <p class="lead">Profit lives in your route. More yards per hour, less driving.</p>
  <ul>
    <li>Group customers by neighborhood and mow them on the same day.</li>
    <li>Use scheduling and invoicing software with route planning and online payments.</li>
    <li>Take a photo of every finished yard.</li>
    <li>Get card-on-file or automatic payments so you're not chasing checks.</li>
    <li>Keep a rain-day plan: shift the route by one day, not the whole week.</li>
    <li>Sharpen blades and service equipment on a set schedule.</li>
  </ul>
  <h3>6.1 · Safety</h3>
  <ul>
    <li>Walk every yard before you mow: rocks, toys, hoses, dog waste.</li>
    <li>Wear eye and ear protection, and never mow slopes that are unsafe for your mower.</li>
    <li>Strap equipment down on the trailer every time.</li>
  </ul>
  <div class="today"><b>Do This Today</b>Pick your scheduling software and draw your first route map.</div>
</template>

<template id="t-7">
  <div class="kicker">Module 7</div>
  <h2>Getting Your First Customers</h2>
  <p class="lead">Your first customers are close by. Every yard you do is an ad to the neighbors.</p>
  <ul>
    <li>Set up a Google Business Profile with your services, service area and before-and-after photos.</li>
    <li>Door hangers on the streets around your current customers.</li>
    <li>Post in Nextdoor and local Facebook groups, following each group's rules.</li>
    <li>Offer a referral reward, like a free mow for every new customer referred.</li>
    <li>Call property managers, real estate agents and landlords about rentals and listings.</li>
    <li>Truck and trailer signs with your phone number.</li>
  </ul>
  <div class="today"><b>Do This Today</b>Create your Google Business Profile and make a door hanger with a first-mow offer.</div>
</template>

<template id="t-8">
  <div class="kicker">Module 8</div>
  <h2>Seasons &amp; Growing</h2>
  <p class="lead">Plan your year so the money doesn't stop when the grass does.</p>
  <div class="cols">
    <div><h4>Spring</h4><ul><li>Cleanups, mulch, aeration and seeding</li><li>Sign up mowing contracts</li></ul></div>
    <div><h4>Summer</h4><ul><li>Weekly mowing routes</li><li>Shrub trimming and bed maintenance</li></ul></div>
    <div><h4>Fall</h4><ul><li>Leaf removal and fall cleanups</li><li>Aeration and overseeding</li></ul></div>
    <div><h4>Winter</h4><ul><li>Snow removal, holiday lights, gutters</li><li>Equipment repair and next year's marketing</li></ul></div>
  </div>
  <h3>8.1 · When to grow</h3>
  <ul>
    <li>Hire your first helper when your route is full and you're turning down work.</li>
    <li>Get workers' comp before anyone works for you.</li>
    <li>Add a licensed service, like weed control, once you've earned the license.</li>
  </ul>

<template id="t-9">
  <div class="kicker">Module 9</div>
  <h2>Your 30-Day Launch Plan</h2>
  <div class="cols">
    <div><h4>Week 1 · Plan</h4><ul><li>Competitor list done</li><li>Services chosen</li><li>Equipment list priced</li></ul></div>
    <div><h4>Week 2 · Legal</h4><ul><li>Business registered, EIN, bank account</li><li>License rules for your state confirmed</li><li>Insurance quotes; coverage bought</li></ul></div>
    <div><h4>Week 3 · Set up</h4><ul><li>Equipment bought and tested</li><li>Price list and scheduling software ready</li><li>Google profile and door hangers ready</li></ul></div>
    <div><h4>Week 4 · Launch</h4><ul><li>Door hangers out on 3 streets</li><li>5 property managers contacted</li><li>First 10 recurring customers booked</li></ul></div>
  </div>
  <h3>Sources used in this course</h3>
  <ul class="note">

<script>
(function(){
var mods=[
{id:"overview",t:"t-overview",full:"Course Overview",short:"Overview"},
{id:"module-1",t:"t-1",full:"1 · Is This Business Right for You?",short:"1 · Fit"},
{id:"module-2",t:"t-2",full:"2 · Choose Your Services",short:"2 · Services"},
{id:"module-3",t:"t-3",full:"3 · Equipment & Startup Costs",short:"3 · Equipment"},
{id:"module-4",t:"t-4",full:"4 · Licenses, Pesticides & Insurance",short:"4 · Legal"},
{id:"module-5",t:"t-5",full:"5 · Pricing Your Services",short:"5 · Pricing"},
{id:"module-6",t:"t-6",full:"6 · Routes & Operations",short:"6 · Routes"},
{id:"module-7",t:"t-7",full:"7 · Getting Your First Customers",short:"7 · Customers"},
{id:"module-8",t:"t-8",full:"8 · Seasons & Growing",short:"8 · Seasons"},
{id:"module-9",t:"t-9",full:"9 · Your 30-Day Launch Plan",short:"9 · Launch"}
];
var KEY="bby-landscaping-done", done={};
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){done={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
var rail=document.getElementById("rail"), lesson=document.getElementById("lesson");
var cur=0;
mods.forEach(function(m,i){
var b=document.createElement("button"); b.type="button"; b.id="nav-"+m.id;
b.innerHTML='<span class="dot" aria-hidden="true"></span><span><span class="full"></span><span class="short"></span></span>';
b.querySelector(".full").textContent=m.full; b.querySelector(".short").textContent=m.short;
b.addEventListener("click",function(){go(i,true)}); rail.appendChild(b);
});
function paint(){
var n=0;
mods.forEach(function(m,i){
var b=document.getElementById("nav-"+m.id);
b.classList.toggle("done",!!done[m.id]); b.querySelector(".dot").textContent=done[m.id]?"✓":"";
b.setAttribute("aria-current",i===cur?"true":"false"); if(done[m.id])n++;
});
document.getElementById("barfill").style.width=(n/mods.length*100)+"%";
document.getElementById("ptext").textContent=n+" of "+mods.length+" complete";
var d=document.getElementById("done"), on=!!done[mods[cur].id];
d.setAttribute("aria-pressed",on?"true":"false"); d.textContent=on?"✓ Completed":"Mark complete";
document.getElementById("prev").hidden=cur===0;
document.getElementById("next").hidden=cur===mods.length-1;
}
function go(i,scroll){
cur=Math.max(0,Math.min(mods.length-1,i));
lesson.innerHTML=""; lesson.appendChild(document.getElementById(mods[cur].t).content.cloneNode(true));
if(location.hash!=="#"+mods[cur].id){try{history.replaceState(null,"","#"+mods[cur].id)}catch(e){location.hash=mods[cur].id}}
paint(); if(scroll)window.scrollTo({top:0});
}
document.getElementById("prev").addEventListener("click",function(){go(cur-1,true)});
document.getElementById("next").addEventListener("click",function(){go(cur+1,true)});
document.getElementById("done").addEventListener("click",function(){
var id=mods[cur].id; if(done[id])delete done[id]; else done[id]=true; save(); paint();
});
function fromHash(){var h=location.hash.slice(1),i=mods.findIndex(function(m){return m.id===h}); go(i<0?0:i,false)}
window.addEventListener("hashchange",fromHash); fromHash();
})();
</script>
