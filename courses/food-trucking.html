<h2>Course Overview</h2>
<p class="lead">By the end of this course you'll have a tested concept and menu, a truck or trailer picked out, a full equipment list with real prices, your permits and insurance lined up, your suppliers set up and your first locations booked.</p>
<div class="cols">
<div><h4>Who it's for</h4>Beginners who want to start a food truck or food trailer, whether you've cooked professionally or just get told your food is good.</div>
<div><h4>How it works</h4>12 modules. Every module ends with a <strong>Do This Today</strong> task. Finish it before you move on.</div>
</div>
<h3>The business in one minute</h3>
<p>A food truck is a small restaurant on wheels. You cook a short menu out of a licensed vehicle, park where the crowds are (breweries, offices, festivals, events), and prep and clean at a licensed kitchen called a commissary. Realistic startup: <strong>about $30,000 for a lean used setup to $200,000+ for a new custom truck</strong>. (<a href="https://merchants.doordash.com/en-us/blog/how-much-does-a-food-truck-cost" target="_blank" rel="noopener">source</a>)</p>
<h3>What you'll build, module by module</h3>
<ol>
<li>Decide if this business fits your life and budget</li>
<li>Pick a concept and build a menu that makes money</li>
<li>Choose and buy your rig: truck, trailer or cart</li>
<li>Set up the truck: layout, power, propane, water and ventilation</li>
<li>Equip the inside: every appliance, tool and supply with prices and where to buy</li>
<li>Build your startup budget</li>
<li>Get licensed, permitted, inspected and insured</li>
<li>Set up suppliers, pricing and your POS</li>
<li>Find locations, book events and market the truck</li>
<li>Run daily operations: open, serve, close, clean</li>
<li>Your 60-day launch plan and every source and vendor link</li>
</ol>
<h3>How to use this course</h3>
<ol>
<li>Go in order. Each module builds on the one before.</li>
<li>Click the links. Every price, rule and vendor links to where it came from or where to buy.</li>
<li>Post your finished Do This Today task in the community for feedback.</li>
<li>Costs and rules change and vary by state, county and city. Every number here is a starting range, so always confirm with your health department, fire marshal and real quotes.</li>
</ol>
<h3>Honest note</h3>
<p>This course teaches you how to build the business. It doesn't promise income. Food trucks have real costs and real risk, and many full-service operators net in the single digits as a percentage of sales. What you earn depends on your food, your prices, your locations and how tightly you control costs.</p>
</template>

<!-- ============ MODULE 1 ============ -->
<template id="t-1">
<div class="kicker">Module 1</div>
<h2>Is a Food Truck Right for You?</h2>
<p class="lead">It's cheaper than opening a restaurant, but it's still a restaurant: long days, hot kitchen, tight space, inspections, breakdowns and weather. Go in with open eyes.</p>

<h3>1.1 · The honest pros and cons</h3>
<div class="cols">
<div class="pro"><h4>Pros</h4>
<ul>
<li>Far cheaper than opening a sit-down restaurant with a lease and build-out</li>
<li>You go where the customers are: offices, breweries, festivals, ballgames</li>
<li>Small menu means less waste and faster service</li>
<li>Private catering (weddings, company lunches, parties) pays a guaranteed minimum</li>
<li>Great way to test a restaurant concept before signing a lease</li>
<li>Strong social media appeal: people love following a truck</li>
<li>The truck itself is an asset you can sell later</li>
</ul></div>
<div class="con"><h4>Cons</h4>
<ul>
<li>Big upfront cost: $30,000 to $200,000+</li>
<li>Long days: prep, drive, set up, serve, break down, clean and restock. 12–14 hours is normal</li>
<li>Weather and slow days can wipe out a week's profit</li>
<li>Breakdowns: no truck, no income</li>
<li>Lots of permits, and each city or county can have its own rules</li>
<li>Thin margins: Restroworks puts typical net margin at 6–10% (<a href="https://www.restroworks.com/blog/food-truck-cost/" target="_blank" rel="noopener">source</a>)</li>
<li>Hot, cramped workspace and physical work</li>
</ul></div>
</div>

<h3>1.2 · Truck, trailer or cart?</h3>
<div class="tablewrap"><table>
<thead><tr><th>Type</th><th>Typical cost</th><th>Best for</th><th>Watch out</th></tr></thead>
<tbody>
<tr><td>Food cart / kiosk</td><td class="num">$5,000–$25,000</td><td>Hot dogs, coffee, ice cream, simple menus</td><td>Very limited menu and storage; some areas restrict carts</td></tr>
<tr><td>Concession trailer</td><td class="num">$15,000–$90,000</td><td>Festivals, fairs, parking at one spot all day</td><td>Need a heavy tow vehicle; harder to move several times a day</td></tr>
<tr><td>Used food truck</td><td class="num">$30,000–$100,000</td><td>Daily routes and multiple stops</td><td>Hidden engine, plumbing and electrical problems</td></tr>
<tr><td>New or custom truck</td><td class="num">$75,000–$200,000+</td><td>Turnkey, financing, warranty</td><td>Big payment before you've proven your concept; build times can run months</td></tr>
</tbody></table></div>
<p class="note">Truck ranges from <a href="https://merchants.doordash.com/en-us/blog/how-much-does-a-food-truck-cost" target="_blank" rel="noopener">DoorDash (Sept 2026)</a>. Cart and trailer ranges are typical market listings; compare real listings in Module 3.</p>

<h3>1.3 · A real day on the truck</h3>
<ol>
<li><strong>6–9 AM:</strong> At the commissary: fill fresh water, dump grey water, load prepped food, check propane and generator fuel.</li>
<li><strong>9–10:30 AM:</strong> Drive to your spot, level the truck, start the generator, fire up equipment, set out menu boards.</li>
<li><strong>11 AM–2 PM:</strong> Lunch service. Take orders, cook, serve, keep hot food above 135°F and cold food below 41°F.</li>
<li><strong>2–4 PM:</strong> Break down, or move to an evening spot (brewery, event).</li>
<li><strong>5–9 PM:</strong> Dinner or event service.</li>
<li><strong>9–11 PM:</strong> Back at the commissary: clean, empty grey water, wash dishes, log temps and sales, prep tomorrow.</li>
</ol>

<h3>1.4 · Check your local market</h3>
<ol>
<li>Search <a href="https://www.google.com/maps/search/food+truck+near+me" target="_blank" rel="noopener">"food truck near me" on Google Maps</a> and check <a href="https://streetfoodfinder.com/" target="_blank" rel="noopener">StreetFoodFinder</a> and <a href="https://www.roaminghunger.com/" target="_blank" rel="noopener">Roaming Hunger</a> for trucks in your area.</li>
<li>Join your area's food truck Facebook groups (search "[your city] food trucks"). See who's posting, where they park and what events book them.</li>
<li>Write down every truck's cuisine, price range and where it parks. Look for a gap: what's missing?</li>
<li>Visit 3 trucks as a customer at lunch. Count customers in 30 minutes and note the average order.</li>
<li>Call your county health department and ask: "What do I need to operate a mobile food unit here, and do I need a commissary?"</li>
</ol>
<div class="today"><b>Do This Today</b>List 10 local trucks with their cuisine, price range and where they park, and call your county health department about mobile food unit rules.</div>

<template id="t-2">
<div class="kicker">Module 2</div>
<h2>Concept &amp; Menu</h2>
<p class="lead">Your concept decides your equipment, your truck layout and your budget. Pick the menu first, then build the truck around it, never the other way around.</p>

<h3>2.1 · Pick a concept that works on wheels</h3>
<ul>
<li><strong>Fast to cook:</strong> each order should be out in 3–7 minutes.</li>
<li><strong>Few ingredients that cross over:</strong> the same protein used in 3–4 items cuts waste.</li>
<li><strong>Easy to eat standing up:</strong> tacos, burgers, bowls, sandwiches, wings, loaded fries.</li>
<li><strong>Something people can remember:</strong> one clear thing you're known for ("smash burgers," "Nashville hot chicken," "birria tacos").</li>
<li><strong>Fits the gap</strong> you found in Module 1.</li>
</ul>

<h3>2.2 · Build a short menu</h3>
<ul>
<li>5–8 main items, 2–3 sides, 2–3 drinks. That's it.</li>
<li>1–2 "hero" items that are on every post and every menu board.</li>
<li>A combo (main + side + drink) to raise your average ticket.</li>
<li>One vegetarian option so groups don't skip you.</li>
<li>Every item must be cookable on the equipment you'll have in a space smaller than a home kitchen.</li>
</ul>

<h3>2.3 · Cost out every item</h3>
<p>Food cost is usually 28–35% of sales. (<a href="https://merchants.doordash.com/en-us/blog/how-much-does-a-food-truck-cost" target="_blank" rel="noopener">source</a>) Write a recipe card for every item with the exact amount and cost of every ingredient, including the bun, sauce, wrapper and napkin.</p>
<p class="formula">Menu price = Plate cost ÷ Target food cost %</p>
<p>Example: a smash burger with fries costs you $3.10 in food and packaging. $3.10 ÷ 0.30 = $10.33, so price it at <strong>$10.99</strong> or <strong>$11</strong>.</p>
<div class="tablewrap"><table>
<thead><tr><th>Recipe card line</th><th>Amount</th><th>Cost</th></tr></thead>
<tbody>
<tr><td>Ground beef 80/20</td><td>2 × 3 oz</td><td class="num">$1.15</td></tr>
<tr><td>Bun</td><td>1</td><td class="num">$0.35</td></tr>
<tr><td>Cheese, onion, pickles, sauce</td><td>—</td><td class="num">$0.55</td></tr>
<tr><td>Fries (6 oz) + oil</td><td>—</td><td class="num">$0.65</td></tr>
<tr><td>Clamshell, wrapper, napkin</td><td>—</td><td class="num">$0.40</td></tr>
<tr class="total"><td>Plate cost</td><td></td><td class="num">$3.10</td></tr>
</tbody></table></div>
<p class="note">Example costs only. Price your own recipe with real supplier prices from Module 8.</p>

<h3>2.4 · Test before you buy a truck</h3>
<ul>
<li>Cook your menu 10+ times for friends and family and time every item.</li>
<li>Do a pop-up, farmers market or catering job using a licensed kitchen (check your state's rules for temporary events).</li>
<li>Ask people what they'd pay. Watch what they finish and what they leave.</li>
</ul>
<div class="today"><b>Do This Today</b>Write your menu (5–8 items) and a recipe card with plate cost and menu price for your top 3 items.</div>
</template>

<h2>Buying Your Rig</h2>
<p class="lead">The truck is your biggest cost and your biggest risk. A cheap truck with bad wiring, a weak engine or a non-compliant kitchen can cost more than a good one.</p>

<h3>3.1 · What rigs cost</h3>
<div class="tablewrap"><table>
<thead><tr><th>Option</th><th>Typical cost</th><th>Good</th><th>Watch out</th></tr></thead>
<tbody>
<tr><td>Used food truck</td><td class="num">$30,000–$100,000</td><td>Ready to work soon; cheaper</td><td>Engine and transmission, rust, old wiring, kitchen that won't pass your county's rules</td></tr>
<tr><td>New fully fitted truck</td><td class="num">≈ $109,500 average</td><td>Built to code, warranty, financing</td><td>Highest cost; long build queue</td></tr>
<tr><td>Custom build</td><td class="num">$100,000–$200,000+</td><td>Laid out exactly for your menu</td><td>Months of build time, change orders</td></tr>
<tr><td>Concession trailer (new)</td><td class="num">$15,000–$90,000</td><td>Lower cost, no engine to break</td><td>Needs a truck that can tow it safely</td></tr>
</tbody></table></div>
<p class="note">Sources: <a href="https://merchants.doordash.com/en-us/blog/how-much-does-a-food-truck-cost" target="_blank" rel="noopener">DoorDash</a>, <a href="https://www.restroworks.com/blog/food-truck-cost/" target="_blank" rel="noopener">Restroworks (2026)</a>. Trailer range is from typical market listings.</p>

<h3>3.2 · Where to buy (vendors)</h3>
<div class="tablewrap"><table>
<thead><tr><th>Vendor</th><th>What they sell</th></tr></thead>
<tbody>
<tr><td><a href="https://www.usedvending.com/" target="_blank" rel="noopener">UsedVending.com</a></td><td>Largest marketplace of used and new food trucks and trailers</td></tr>
<tr><td><a href="https://www.roaminghunger.com/food-trucks-for-sale/" target="_blank" rel="noopener">Roaming Hunger Marketplace</a></td><td>Used and new trucks and trailers for sale</td></tr>
<tr><td><a href="https://www.prestigefoodtrucks.com/" target="_blank" rel="noopener">Prestige Food Trucks</a></td><td>Custom-built trucks and trailers, financing</td></tr>
<tr><td><a href="https://www.mrtrailers.com/" target="_blank" rel="noopener">M&amp;R Specialty Trailers and Trucks</a></td><td>Custom concession trailers and trucks</td></tr>
<tr><td><a href="https://www.cruisingkitchens.com/" target="_blank" rel="noopener">Cruising Kitchens</a></td><td>High-end custom builds</td></tr>

<tr><td><a href="https://www.facebook.com/marketplace/" target="_blank" rel="noopener">Facebook Marketplace</a> &amp; <a href="https://www.craigslist.org/" target="_blank" rel="noopener">Craigslist</a></td><td>Local private sales (cheapest, highest risk)</td></tr>
</tbody></table></div>
<p class="note">These are well-known vendors, not endorsements. Get at least 3 quotes and check reviews and Better Business Bureau ratings before sending any deposit.</p>

<h3>3.3 · Used truck inspection checklist</h3>
<ul>
<li>Have a <strong>diesel or truck mechanic</strong> inspect the engine, transmission, brakes, tires and frame. Check the title and mileage.</li>
<li>Ask for the truck's <strong>last health permit and fire inspection</strong>. A truck that passed recently in a nearby county is a good sign.</li>
<li>Check the <strong>plumbing</strong>: hand sink and 3-compartment sink, hot water under pressure, and a waste tank larger than the fresh tank.</li>
<li>Check the <strong>hood and fire suppression</strong>: when was it last serviced? Tags should be current.</li>
<li>Check <strong>propane lines</strong> for leaks and that tanks are in date.</li>
<li>Check the <strong>electrical panel</strong>, outlets and generator hours.</li>
<li>Test every appliance hot and cold: fridge temps, fryer heats up, griddle heats evenly.</li>
<li>Look for floor rot, rust and water damage under the sinks and around the serving window.</li>
<li>Bring your county's mobile unit requirements and check them line by line <em>before</em> you buy.</li>
</ul>

<h3>3.4 · Financing options</h3>
<ul>
<li><a href="https://www.sba.gov/funding-programs/loans" target="_blank" rel="noopener">SBA loans</a> (7(a) and microloans) through local banks and lenders</li>
<li>Builder financing (most custom builders offer it)</li>
<li>Equipment financing and leasing</li>
<li>Local credit unions and <a href="https://www.cdfifund.gov/" target="_blank" rel="noopener">CDFI lenders</a></li>
</ul>

<h2>Setting Up Your Truck</h2>
<p class="lead">A good truck layout lets one or two people cook fast without bumping into each other. The systems behind the walls (power, propane, water, ventilation) are what get you through inspection.</p>

<h3>4.1 · Lay out the line like an assembly line</h3>
<p>Food should move in one direction: <strong>cold storage → prep → cook → hold → serve window</strong>.</p>
<ol>
<li><strong>Cold zone:</strong> reach-in fridge and freezer closest to the prep table.</li>
<li><strong>Prep zone:</strong> refrigerated prep table (sandwich/salad unit) next to the cook line.</li>
<li><strong>Hot zone:</strong> griddle, fryer, range or charbroiler all under the hood, on the back wall.</li>
<li><strong>Hold &amp; finish zone:</strong> heat lamp or warmer and packaging right before the window.</li>
<li><strong>Service window:</strong> POS, order ticket rail, napkins and sauces.</li>
<li><strong>Wash zone:</strong> 3-compartment sink and a separate hand sink, away from food prep.</li>
</ol>
<p class="note">Rule of thumb: a cook should be able to reach the fridge, griddle and plating area in 1–2 steps.</p>

<h3>4.2 · Power: generator and electrical</h3>
<ul>
<li>Add up the <strong>running watts</strong> of everything that can run at once (fridges, freezer, prep table, lights, fans, water pump, POS, any electric fryers). Then add 25% headroom.</li>
<li>Fridges and AC units need 2–3× their running watts for a moment when they start. Size for that.</li>
<li>Most trucks use a <strong>quiet inverter generator</strong> (many events and cities have noise limits) or a built-in RV-style generator.</li>
<li>Add a <strong>shore power inlet</strong> so you can plug in at events and the commissary.</li>
<li>Have a licensed electrician check the panel, breakers and GFCI outlets near water.</li>
</ul>
<p class="formula">Generator size = (Total running watts + biggest startup surge) × 1.25</p>

<h3>4.3 · Propane (gas)</h3>
<ul>
<li>Propane runs griddles, fryers, ranges and water heaters. Tanks are mounted <strong>outside</strong> the kitchen, secured, with a regulator and shut-off valve.</li>
<li>Use commercial flexible gas connectors (quick-disconnect hose kits) on appliances so you can pull them out to clean.</li>
<li>Install a <strong>propane leak detector</strong> and a <strong>carbon monoxide detector</strong> inside the truck.</li>
<li>Your fire marshal will inspect the gas system. Many require a leak (pressure) test by a licensed gas technician.</li>
<li>Refill at a local propane dealer (e.g. <a href="https://www.amerigas.com/" target="_blank" rel="noopener">AmeriGas</a>, <a href="https://www.ferrellgas.com/" target="_blank" rel="noopener">Ferrellgas</a>, or a local supplier). Tractor Supply and U-Haul often refill too.</li>
</ul>

<h3>4.4 · Water and plumbing</h3>
<p>Health departments are strict here. In Lexington, KY, for example, a mobile unit needs a hand sink, a 3-compartment sink, an NSF fresh water tank, hot and cold running water under pressure, and a <strong>waste tank at least 50% larger than the fresh tank</strong>. (<a href="https://www.lfchd.org/wp-content/uploads/2021/05/English-Guidelines-for-Mobile-Food-Units-5-10-2021.pdf" target="_blank" rel="noopener">LFCHD guidelines</a>)</p>
<ul>
<li>Fresh water tank (NSF/food-grade), often 30–50 gallons</li>
<li>Grey (waste) water tank, larger than fresh</li>
<li>12-volt water pump (e.g. <a href="https://www.shurflo.com/" target="_blank" rel="noopener">SHURflo</a>) and accumulator tank</li>
<li>Water heater: small electric tank or propane on-demand unit</li>
<li>Food-grade (white or blue) drinking water hose for filling, kept separate from any other hose</li>
<li>In Kentucky, plumbing plans need state review and a plumbing inspection (green sticker) before the health inspection.</li>
</ul>

<h3>4.5 · Ventilation and fire safety</h3>
<ul>
<li>A commercial <strong>Type I exhaust hood</strong> is required over grease-producing equipment (griddles, fryers, charbroilers) under NFPA 96.</li>
<li>A <strong>fire suppression system</strong> (e.g. <a href="https://www.ansul.com/" target="_blank" rel="noopener">Ansul</a>, <a href="https://www.amerex-fire.com/" target="_blank" rel="noopener">Amerex</a>) in the hood, with a manual pull station and automatic gas shut-off. It must be inspected about every 6 months by a licensed fire protection company.</li>
<li><strong>Class K extinguisher</strong> near the fryer, plus an <strong>ABC extinguisher</strong>.</li>
<li>Hood filters cleaned weekly; hood and duct professionally cleaned on a schedule.</li>
<li>See the <a href="https://www.nfpa.org/" target="_blank" rel="noopener">NFPA food truck safety resources</a>.</li>
</ul>
<p class="note">Hood plus fire suppression together typically run $5,000–$10,000 installed. (<a href="https://www.restroworks.com/blog/food-truck-cost/" target="_blank" rel="noopener">source</a>)</p>

<h3>4.6 · Finishes inspectors look for</h3>
<ul>
<li>Smooth, non-absorbent, easy-to-clean walls and ceiling (stainless steel or FRP)</li>
<li>Commercial non-slip, washable floor with sealed seams</li>
<li>Shielded or shatter-proof lights</li>
<li>Screened windows and a self-closing serving window or door</li>
<li>Commercial (NSF-listed) equipment only, no home appliances</li>
<li>Everything secured so it can't move while driving</li>
</ul>

<h3>6.3 · Know your break-even</h3>
<p class="formula">Break-even sales per month = Fixed monthly costs ÷ (1 − Food cost % − Card fees %)</p>

<li>Submit your menu, truck layout and equipment list for plan review.</li>
<li>Pass the health inspection. Keep hot food at 135°F or above and cold food at 41°F or below.</li>

<p>Tips: compare prices on your top 10 ingredients every month, buy packaging by the case, and track waste daily.</p>

<h3>8.2 · Pricing checklist</h3>
<ul>
<li>Keep food + packaging at 28–35% of each price (Module 2 formula).</li>
<li>Use round prices ($10, $12, $14) for faster service and easier cash.</li>
<li>Build combos to raise your average order.</li>
<li>Price event and catering menus higher to cover fees and minimums.</li>
<li>Add card fees into your prices instead of charging a surcharge at the window.</li>
</ul>

<p class="note">Cloud POS often runs $50–$150/mo, up to $300/mo for a full software stack. (<a href="https://www.restroworks.com/blog/food-truck-cost/" target="_blank" rel="noopener">source</a>) Pick one that works offline, because festival Wi-Fi and cell signal are often bad.</p>

<h3>8.4 · Online ordering and delivery</h3>
<ul>
<li>Turn on pre-ordering through your POS so office crowds can order ahead.</li>
<li>Delivery apps (<a href="https://merchants.doordash.com/" target="_blank" rel="noopener">DoorDash</a>, <a href="https://merchants.ubereats.com/" target="_blank" rel="noopener">Uber Eats</a>, <a href="https://get.grubhub.com/" target="_blank" rel="noopener">Grubhub</a>) can work on days you're parked in one spot. Check their commission and price your app menu to cover it.</li>
</ul>

<div class="kicker">Module 9</div>
<h2>Locations, Events &amp; Marketing</h2>
<p class="lead">Where you park decides how much you sell. Build a weekly schedule of steady spots, then add events and catering on top.</p>

<h3>9.1 · Where food trucks make money</h3>
<ul>
<li><strong>Breweries and wineries:</strong> most don't serve food and want trucks. Often no fee.</li>
<li><strong>Office parks, hospitals, factories:</strong> weekday lunch crowds with no good food nearby.</li>
<li><strong>Apartment complexes and neighborhoods:</strong> evening "truck nights."</li>
<li><strong>Festivals, fairs, concerts, ballgames:</strong> big sales days, but higher fees.</li>
<li><strong>Private catering:</strong> weddings, birthdays, company lunches, graduations. Charge a guaranteed minimum.</li>
<li><strong>Food truck parks and rallies</strong> in your area.</li>
</ul>
<p class="note">Always check that the spot is allowed: private property needs the owner's written permission, and many cities restrict street parking for trucks.</p>

<h3>9.2 · Booking platforms</h3>

<tr><td>Local Facebook groups</td><td>Event organizers post "trucks wanted" all the time</td></tr>

<h3>9.3 · Marketing that works for trucks</h3>
<ol>
<li>Set up a <a href="https://www.google.com/business/" target="_blank" rel="noopener">Google Business Profile</a>, Instagram, Facebook and TikTok.</li>
<li>Post your weekly schedule every Monday and your location every day you're out.</li>
<li>Short videos of food on the griddle, the line out the window and customer reactions.</li>
<li>Use the same name and logo on the truck, menu, cups and social handles.</li>
<li>Collect phone numbers or emails (POS loyalty or a text club) to announce spots.</li>
<li>Partner with breweries and businesses: they post you, you post them.</li>
</ol>

<h3>9.4 · Pitch for a brewery or business</h3>
<p class="formula">"Hi, I'm [name] with [truck]. We serve [cuisine], fully licensed and insured. We'd love to park at [place] on [day]. We bring our own power and water, handle all our trash, and we'll promote you to our followers. Can I send you our menu and insurance certificate?"</p>

<template id="t-10">
<div class="kicker">Module 10</div>
<h2>Daily Operations</h2>
<p class="lead">Checklists keep you safe, legal and fast. Print these and tape them inside the truck.</p>

<h3>10.1 · Opening checklist</h3>
<ul>
<li>Fresh water tank full, grey tank empty</li>
<li>Propane levels checked, lines and leak detector OK</li>
<li>Generator fueled and oil checked</li>
<li>All food loaded, labeled and dated; fridge temps logged at 41°F or below</li>
<li>Hand sink stocked with soap and paper towels; sanitizer bucket mixed and tested</li>
<li>Fire extinguishers in place, suppression pull station clear</li>
<li>Truck leveled and chocked</li>
<li>POS charged, card reader working, cash drawer counted</li>
<li>Menu board out, items you're out of marked</li>
</ul>

<h3>10.2 · During service</h3>
<ul>
<li>Check and log hot holding (135°F+) and cold holding (41°F or below) every 2–4 hours</li>
<li>Wash hands between raw and ready-to-eat food and every time you change tasks</li>
<li>One person on the window, one on the line when possible</li>
<li>Keep the line moving: call out wait times if it's backing up</li>
<li>Track what sells out and when</li>
</ul>

<h3>10.3 · Closing checklist</h3>
<ul>
<li>Cool and store leftovers properly or throw them out</li>
<li>Scrape and clean griddle; filter or change fryer oil</li>
<li>Wash, rinse and sanitize all dishes in the 3-compartment sink</li>
<li>Wipe down every surface, sweep and mop</li>
<li>Empty grey water and grease <strong>only</strong> at the commissary or approved site</li>
<li>Count cash, close out POS, log sales and waste</li>
<li>Write tomorrow's prep list and order list</li>
</ul>

<h3>10.4 · Maintenance schedule</h3>
<div class="tablewrap"><table>
<thead><tr><th>How often</th><th>Task</th></tr></thead>
<tbody>
<tr><td>Daily</td><td>Clean griddle, fryer, hood filters as needed; check tires and fluids</td></tr>
<tr><td>Weekly</td><td>Deep clean, hood filters washed, fridge coils checked, inventory count</td></tr>
<tr><td>Monthly</td><td>Generator oil (by hours), propane system check, pest check</td></tr>
<tr><td>Every ~6 months</td><td>Fire suppression inspection by a licensed company; hood and duct cleaning as needed</td></tr>
<tr><td>Yearly</td><td>Extinguisher inspection, permit renewals, insurance renewal, vehicle service</td></tr>
</tbody></table></div>

<h3>10.5 · Numbers to track every week</h3>
<ul>
<li>Sales per day and per location</li>
<li>Number of orders and average order</li>
<li>Food cost % (purchases ÷ sales)</li>
<li>Labor cost %</li>
<li>Best and worst sellers</li>
<li>Which spots are worth going back to</li>
</ul>
<p class="note">Many trucks report $20,000–$50,000 in monthly sales once established, with net margins around 6–10%. (<a href="https://www.restroworks.com/blog/food-truck-cost/" target="_blank" rel="noopener">source</a>) Your results will depend on your market and execution.</p>
<div class="today"><b>Do This Today</b>Print your opening and closing checklists and a temperature log, and practice a full open-to-close run before your first real service.</div>
