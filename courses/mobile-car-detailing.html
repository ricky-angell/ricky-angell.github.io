<p class="lead">By the end of this course you'll have a written plan, a real equipment budget, your business registered and insured, a priced service menu, a booking system and your first cars on the calendar.</p>
<div class="cols">
<div><h4>Who it's for</h4>Beginners who want to start a mobile car detailing business, whether you've detailed before or only washed your own car.</div>

<h3>The business in one minute</h3>
<p>You drive to the customer's home or job, bring your own water and power, and clean, protect and restore their vehicle while they go on with their day. You can start lean, with a pickup or SUV and about <strong>$2,500–$5,000</strong> in gear, and grow into a trailer or van rig. (<a href="https://www.zarla.com/guides/how-to-start-a-car-detailing-business" target="_blank" rel="noopener">source</a>)</p>
<h3>How to use this course</h3>
<ol>
<li>Go in order. Each module builds on the one before.</li>

<li>Costs and rules change and vary by state and city. Every number here is a starting range, so always confirm with your local offices and real quotes.</li>
</ol>
<h3>Honest note</h3>
<p>This course teaches you how to build the business. It doesn't promise income. What you earn depends on your skill, your market, your prices, the weather and how many cars you can do well in a day.</p>

<div class="kicker">Module 1</div>
<h2>Is This Business Right for You?</h2>
<p class="lead">Mobile detailing is cheap to start and in demand everywhere, but it's physical work done outside in heat, cold and rain. Know what you're signing up for before you buy anything.</p>

<h3>1.1 · The honest pros and cons</h3>
<div class="cols">
<div class="pro"><h4>Pros</h4>
<ul>
<li>One of the lowest-cost businesses to start: you can begin with a few thousand dollars in gear</li>
<li>High margins on labor: mobile detailers often keep 60–75% of each ticket after supplies (<a href="https://jim.com/blog/how-to-start-a-car-detailing-business" target="_blank" rel="noopener">source</a>)</li>
<li>Customers pay extra for you to come to them</li>
<li>Repeat business: maintenance washes every 2–4 weeks, full details a few times a year</li>
<li>Upsells like ceramic coating and paint correction pay $250–$1,200+ per job</li>
<li>No rent. Your "shop" is the customer's driveway</li>
<li>Easy to add services later: fleets, dealerships, boats, RVs</li>
</ul></div>
<div class="con"><h4>Cons</h4>
<ul>
<li>Weather kills days. Rain, freezing temps and extreme heat mean cancellations</li>
<li>Hard on your body: kneeling, bending, lifting and standing for hours</li>
<li>Very easy to start, so there's lots of cheap competition</li>
<li>You're responsible for the customer's car. One scratch or burned panel can cost you</li>
<li>Water runoff rules: in many cities you can't let wash water hit the storm drain</li>
<li>Driving time between jobs is unpaid time</li>
<li>Income is seasonal in cold states unless you sell interior work and coatings in winter</li>
</ul></div>
</div>

<h3>1.2 · A real day on the route</h3>
<ol>
<li>Morning rig check: water tank full, generator fueled, chemicals mixed, clean towels and pads loaded.</li>
<li>Drive to your first job. Confirm you're on time with a text.</li>
<li>Walk around the car with the owner. Point out existing scratches, stains and dents and take photos <em>before</em> you touch it.</li>
<li>Detail: interior first (vacuum, steam or extract, wipe down, glass), then exterior (wheels, foam, hand wash, dry, protect).</li>
<li>Walk the owner around the finished car, take after photos, collect payment and book the next visit before you leave.</li>
<li>End of day: wash towels, empty and dispose of wastewater the legal way, restock and confirm tomorrow's jobs.</li>
</ol>
<p class="note">Rough job times: a basic wash and vacuum takes about 45 minutes, a standard interior about 90 minutes, and a heavily dirty interior 3–4 hours. (<a href="https://www.housecallpro.com/resources/how-much-to-charge-for-car-detailing/" target="_blank" rel="noopener">source</a>)</p>

<h3>1.3 · Check your local demand</h3>
<p>Before you spend a dollar, find out who you're competing with and what they charge.</p>
<ol>
<li>Search <a href="https://www.google.com/maps/search/mobile+car+detailing+near+me" target="_blank" rel="noopener">"mobile car detailing near me" on Google Maps</a> and list every competitor within 30 minutes.</li>
<li>Write down each one's packages, prices, number of reviews and rating.</li>
<li>Check <a href="https://www.facebook.com/marketplace/" target="_blank" rel="noopener">Facebook Marketplace</a> and local Facebook groups for "detailing" to see the cheap side of the market.</li>
<li>Text or call 3 of them as a customer and ask when they can come out. If they're booked a week or more out, demand is strong.</li>
<li>Read their 1-star and 3-star Google reviews. Late arrivals, no-shows and missed spots are the gaps you'll fill.</li>
<li>Mark the neighborhoods with newer cars, busy families and office parks. That's where you'll market first.</li>
</ol>
<div class="today"><b>Do This Today</b>Build a competitor list with at least 5 local detailers: their prices for an interior, an exterior and a full detail, plus their review count.</div>
</template>

<h2>Skills &amp; Training</h2>
<p class="lead">No state license is needed to detail cars, but skill is what lets you charge real prices and keeps you from damaging paint. Learn on your own cars and family cars first.</p>

<h3>2.1 · The core skills, in order</h3>
<ol>
<li><strong>Safe washing:</strong> two-bucket or rinseless method, foam pre-soak, wheels first, clean mitts and towels. Most swirl marks come from bad washing.</li>
<li><strong>Interior:</strong> vacuuming, brushing, steam, carpet and seat extraction, leather cleaning, plastics and glass.</li>
<li><strong>Decontamination:</strong> iron remover and clay bar to get paint smooth before polishing or coating.</li>
<li><strong>Machine polishing:</strong> using a dual-action (DA) polisher to remove light swirls without burning through paint.</li>
<li><strong>Protection:</strong> spray sealants first, then ceramic coatings once you're confident with paint prep.</li>
<li><strong>Customer side:</strong> walk-around inspections, explaining what can and can't be fixed, and asking for reviews.</li>
</ol>

<h2>Startup Costs &amp; Your Setup</h2>
<p class="lead">Mobile detailing can be started for about $2,400 and fully outfitted for about $15,000 before a vehicle. Your rig and your equipment are your two big decisions. (<a href="https://www.zarla.com/guides/how-to-start-a-car-detailing-business" target="_blank" rel="noopener">source</a>)</p>

<h3>3.1 · Pick your rig</h3>
<div class="tablewrap"><table>
<thead><tr><th>Option</th><th>Typical cost</th><th>Good</th><th>Watch out</th></tr></thead>

<tr><td>Your own SUV or pickup bed setup</td><td class="num">$0 + gear</td><td>Cheapest way to start this week</td><td>Limited water (around 50–100 gal), no room to grow, harder on your personal vehicle</td></tr>

<h2>Legal, Licensing, Insurance &amp; Water Rules</h2>
<p class="lead">There's no state detailing license in most places, but you still need to register the business, carry the right insurance and handle wash water legally.</p>

<h3>4.1 · Register the business</h3>
<ol>
<li><strong>Pick a structure.</strong> Most detailers start as an LLC to separate business and personal risk. KY LLC filing is about $40; other states vary (TX $300, CA $70 plus an $800/yr tax). (<a href="https://www.zarla.com/guides/how-to-start-a-car-detailing-business" target="_blank" rel="noopener">source</a>)
<ul>
<li>Kentucky: <a href="https://www.sos.ky.gov/bus/business-filings/" target="_blank" rel="noopener">KY Secretary of State business filings</a></li>
<li>West Virginia: <a href="https://onestop.wv.gov/" target="_blank" rel="noopener">WV One Stop Business Portal</a></li>
<li>Ohio: <a href="https://www.ohiosos.gov/businesses/" target="_blank" rel="noopener">Ohio Secretary of State</a></li>
<li>Any state: <a href="https://www.sba.gov/business-guide/launch-your-business/register-your-business" target="_blank" rel="noopener">SBA: Register your business</a></li>
</ul></li>
<li><strong>Get a free EIN</strong> from the <a href="https://www.irs.gov/businesses/small-businesses-self-employed/apply-for-an-employer-identification-number-ein-online" target="_blank" rel="noopener">IRS</a>. Never pay a third-party site for this.</li>
<li><strong>Get a local business license</strong> from your city or county clerk. Usually $50–$150. (<a href="https://jim.com/blog/how-to-start-a-car-detailing-business" target="_blank" rel="noopener">source</a>) Ask if they need a separate mobile vendor permit.</li>
<li><strong>Ask about sales tax.</strong> Some states tax detailing (NY, WA; FL once wax or coating is applied); others don't. Check your state's revenue department.</li>
<li><strong>Open a business bank account</strong> and run every dollar through it.</li>
</ol>

<h3>4.2 · Insurance you need</h3>
<div class="tablewrap"><table>
<thead><tr><th>Policy</th><th>What it covers</th><th>Average cost</th></tr></thead>
<tbody>
<tr><td>General liability</td><td>Injury or damage to people and property (like overspray on a neighbor's car)</td><td class="num">≈ $54/mo ($646/yr)</td></tr>
<tr><td>Garagekeepers</td><td>The <em>customer's car</em> while it's in your care. This is the one detailers forget.</td><td class="num">≈ $38/mo</td></tr>
<tr><td>Commercial auto</td><td>Your work truck or van and the trailer you tow</td><td class="num">≈ $46/mo ($550/yr)</td></tr>
<tr><td>Workers' comp</td><td>Employees' injuries (required in most states once you hire)</td><td class="num">≈ $131/mo</td></tr>
<tr><td>Inland marine / tools</td><td>Theft of your equipment from the rig</td><td class="num">Get quotes</td></tr>
</tbody></table></div>
<p class="note">Averages are Insureon figures for auto detailing businesses, as reported by <a href="https://www.zarla.com/guides/how-to-start-a-car-detailing-business" target="_blank" rel="noopener">Zarla</a>. More on coverage types from <a href="https://blog.detailking.com/insurance-for-auto-detailing-and-mobile-auto-detailing-businesses/" target="_blank" rel="noopener">Detail King</a>. Get quotes from <a href="https://www.insureon.com/" target="_blank" rel="noopener">Insureon</a>, <a href="https://www.nextinsurance.com/" target="_blank" rel="noopener">NEXT</a>, <a href="https://www.thehartford.com/business-insurance/garage-keepers-insurance" target="_blank" rel="noopener">The Hartford</a> and a local agent. Carry a copy of your certificate in the rig, because apartment complexes and office parks will ask for it.</p>

<h3>4.3 · Wash water: don't skip this</h3>
<p>Wash water with soap, oil and brake dust counts as pollution under the Clean Water Act. Many cities ban letting it run into the storm drain, and fines can be steep: San Diego and Pinellas County, FL can fine up to <strong>$10,000 per day</strong>. (<a href="https://www.zarla.com/guides/how-to-start-a-car-detailing-business" target="_blank" rel="noopener">source</a>)</p>
<ul>
<li>Call your city's stormwater or public works office and ask: "What are the rules for mobile car washing and where can I dump my wastewater?"</li>
<li>Your options: rinseless or waterless washes (almost no runoff), a <strong>water containment mat</strong> with a pump-out tank, or washing over grass/gravel where the city allows it.</li>
<li>Never pour wastewater into a storm drain. Dispose of it into a sanitary sewer only with permission.</li>
<li>Examples of real city rules: <a href="https://www.sandiego.gov/sites/default/files/mobile_business_fact_sheet.pdf" target="_blank" rel="noopener">San Diego mobile business fact sheet</a>, <a href="https://santabarbaraca.gov/sites/default/files/documents/Public%20Works/Lab/BMP%20Auto-detailers.pdf" target="_blank" rel="noopener">Santa Barbara auto detailer best practices</a>, <a href="https://www.epa.gov/npdes/stormwater-discharges-municipal-sources" target="_blank" rel="noopener">EPA stormwater program</a>.</li>
</ul>
<div class="today"><b>Do This Today</b>File your LLC (or start the form), apply for your EIN, and get 2 insurance quotes that include garagekeepers coverage.</div>

<h2>Services &amp; Pricing</h2>
<p class="lead">Price by package and vehicle size, not by the hour. Don't try to be the cheapest detailer in town. Be the most reliable one.</p>

<h3>5.1 · What the market charges</h3>
<div class="tablewrap"><table>
<thead><tr><th>Service</th><th>Typical price range</th></tr></thead>
<tbody>
<tr><td>Exterior wash &amp; protect</td><td class="num">$60–$150</td></tr>
<tr><td>Interior detail</td><td class="num">$80–$350</td></tr>
<tr><td>Full detail (inside + out)</td><td class="num">$150–$500+</td></tr>
<tr><td>Mobile package for a midsize SUV: basic / standard / premium</td><td class="num">$158 / $278 / $443</td></tr>
<tr><td>Paint correction</td><td class="num">$250–$1,000+</td></tr>
<tr><td>Ceramic coating (varies by years of protection)</td><td class="num">$600–$2,000+</td></tr>
<tr><td>Seat shampoo or steam</td><td class="num">$70–$235</td></tr>
<tr><td>Headlight restoration</td><td class="num">$50–$125</td></tr>
<tr><td>Pet hair removal</td><td class="num">$25–$75</td></tr>
<tr><td>Odor removal (ozone)</td><td class="num">$40–$150</td></tr>
<tr><td>Engine bay</td><td class="num">$25–$75</td></tr>
</tbody></table></div>
<p class="note">Sources: <a href="https://www.housecallpro.com/resources/how-much-to-charge-for-car-detailing/" target="_blank" rel="noopener">Housecall Pro pricing guide (Nov 2026)</a> and <a href="https://blog.detailking.com/how-to-start-a-detailing-business/" target="_blank" rel="noopener">Detail King</a>. Your local prices from Module 1 matter more than national averages.</p>

<h3>5.2 · Charge more for bigger vehicles</h3>
<div class="tablewrap"><table>
<thead><tr><th>Vehicle size</th><th>Example</th><th>Full detail range</th></tr></thead>
<tbody>
<tr><td>Small</td><td>Coupe, compact sedan</td><td class="num">$50–$175</td></tr>
<tr><td>Medium</td><td>Midsize sedan, small SUV</td><td class="num">$175–$250</td></tr>
<tr><td>Large</td><td>Full-size SUV, pickup</td><td class="num">$225–$400</td></tr>
<tr><td>Extra large</td><td>3-row SUV, van, lifted truck</td><td class="num">$500–$650+</td></tr>
</tbody></table></div>
<p class="note">(<a href="https://www.housecallpro.com/resources/how-much-to-charge-for-car-detailing/" target="_blank" rel="noopener">source</a>)</p>

<h3>5.3 · Price every job with this formula</h3>
<p class="formula">Price = (Hours × your hourly rate) + Supplies + Travel/overhead + Profit</p>
<p>Example: a full detail takes 3 hours. 3 × $25 labor = $75, supplies $35, overhead (fuel, insurance, software) $33. Cost = $143. Add a 30% margin and the price is about <strong>$204</strong>. (<a href="https://www.housecallpro.com/resources/how-much-to-charge-for-car-detailing/" target="_blank" rel="noopener">source</a>)</p>

<h3>5.4 · Build a simple 3-tier menu</h3>
<ul>
<li><strong>Basic:</strong> exterior hand wash, wheels, tires, windows, quick vacuum.</li>
<li><strong>Standard (your best seller):</strong> full interior + exterior, wipe down, spray sealant.</li>
<li><strong>Premium:</strong> standard + seat extraction or steam, clay bar, one-step polish.</li>
<li><strong>Maintenance plan:</strong> discounted wash every 2 or 4 weeks for customers who got a full detail. This is your steady income.</li>
<li>Keep discounts to 10–15% at most, and add a trip fee outside your main service area.</li>
</ul>
<div class="today"><b>Do This Today</b>Write your 3-tier menu with prices by vehicle size, plus your add-ons and a monthly maintenance plan price.</div>

<h2>Booking, Routes &amp; Operations</h2>
<p class="lead">Online booking, deposits and tight routes are what separate a real business from a side hustle.</p>

<h3>6.1 · Booking and payment software</h3>
<div class="tablewrap"><table>
<thead><tr><th>Tool</th><th>Good for</th></tr></thead>
<tbody>
<tr><td><a href="https://www.urable.com/" target="_blank" rel="noopener">Urable</a></td><td>Built for detailers: booking, inspections with photos, invoices</td></tr>
<tr><td><a href="https://www.mobile-tech-rx.com/" target="_blank" rel="noopener">Mobile Tech RX</a></td><td>Mobile auto services, quotes and invoices</td></tr>
<tr><td><a href="https://www.getjobber.com/" target="_blank" rel="noopener">Jobber</a></td><td>Scheduling, routing, quotes, reviews</td></tr>
<tr><td><a href="https://www.housecallpro.com/" target="_blank" rel="noopener">Housecall Pro</a></td><td>Scheduling, payments, automated reminders</td></tr>
<tr><td><a href="https://squareup.com/us/en/appointments" target="_blank" rel="noopener">Square Appointments</a></td><td>Free plan to start, card reader for payments</td></tr>
</tbody></table></div>
<p class="note">Most have free trials. Check each site for current plans and pricing.</p>

<h3>6.2 · Policies to set before your first job</h3>
<ul>
<li><strong>Deposit:</strong> take a $25–$50 deposit at booking to stop no-shows.</li>
<li><strong>Weather policy:</strong> free reschedule for rain, freezing temps or severe heat.</li>
<li><strong>Access:</strong> customer provides parking space; you bring water and power (or note if you need their outlet or spigot).</li>
<li><strong>Condition clause:</strong> extra charge for excessive pet hair, mold, biohazards or sand. Say it upfront.</li>
<li><strong>Pre-existing damage:</strong> you photograph the car before you start and note scratches and dents in the booking.</li>
</ul>

<h3>6.3 · Plan your routes</h3>
<ul>
<li>Split your area into zones and work one zone per day so you're not driving across town between jobs.</li>
<li>Stack jobs: office parks and apartment complexes let you do 2–4 cars in one stop.</li>
<li>Block out real job times from your practice runs, plus 30 minutes of drive and setup per job.</li>
<li>Do 3–4 full details or 6–8 maintenance washes per day solo. More than that and quality slips.</li>
</ul>

<h3>6.4 · Track your numbers</h3>
<p>Every week, track: jobs done, average ticket, supply cost per job, miles driven and how many customers rebooked. Your rebooking rate is the number that tells you if the business will last.</p>
<div class="today"><b>Do This Today</b>Sign up for a free trial of one booking tool, load your service menu and write your deposit, weather and cancellation policies.</div>

<p class="lead">Detailing sells with before and after photos. Your first job is to get cars done, get them on camera and get reviews.</p>

<h3>7.1 · Set up your online presence</h3>
<ol>

<li>Ask every happy customer for a Google review right when you show them the finished car.</li>

<h3>7.2 · Where your first 10 cars come from</h3>
<ul>
<li><strong>Friends &amp; family:</strong> launch special in exchange for photos and a review.</li>
<li><strong>Local Facebook groups and Nextdoor:</strong> post your launch offer with real before/after photos.</li>
<li><strong>Door hangers:</strong> hit nice neighborhoods right after you finish a car on that street.</li>
<li><strong>Office parks and employers:</strong> offer "we detail your car while you work" days.</li>
<li><strong>Car dealerships and used car lots:</strong> they need cars reconditioned for sale every week.</li>
